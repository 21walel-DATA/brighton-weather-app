<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Weather App - Stage 2</title>
</head>
<body>
  <h1>Brighton Weather - Stage 2</h1>

  <p>Showing weather for: <strong id="townName"></strong></p>
  <p>Open-Meteo URL: <a id="weatherLink" target="_blank"></a></p>

  <h2>Raw weather data</h2>
  <pre id="rawData">Loading...</pre>

  <script>
    // CONFIG holds all the settings for the app in one place.
    // Open-Meteo needs no API key, so we do not need one here.
    // If an API did need a key, this is where it would go,
    // for example: apiKey: "your-key-here"
    const CONFIG = {
      town: "Brighton",
      latitude: 50.8284,
      longitude: -0.1395
    };

    // buildUrl joins strings together with + to make the Open-Meteo forecast URL.
    // It asks for the current temperature, weather code and wind speed,
    // using the Europe/London timezone (the / is written as %2F in a URL).
    function buildUrl() {
      const url = "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + CONFIG.latitude +
        "&longitude=" + CONFIG.longitude +
        "&current=temperature_2m,weather_code,wind_speed_10m" +
        "&timezone=Europe%2FLondon";
      return url;
    }

    // showPage puts the town name and the URL link onto the page.
    function showPage() {
      const url = buildUrl();

      document.getElementById("townName").textContent = CONFIG.town;

      const link = document.getElementById("weatherLink");
      link.href = url;
      link.textContent = url;
    }

    // loadWeather asks the API for the weather and shows the raw JSON in the pre tag.
    // async lets us use await, which waits for each step to finish before moving on.
    async function loadWeather() {
      // Step 1: send the request and wait for the response
      const response = await fetch(buildUrl());

      // Step 2: turn the response into a JavaScript object
      const data = await response.json();

      // Step 3: turn the object back into neat text (2 spaces per indent) and show it
      document.getElementById("rawData").textContent = JSON.stringify(data, null, 2);
    }

    // Run these when the page loads
    showPage();
    loadWeather();
  </script>
</body>
</html>
